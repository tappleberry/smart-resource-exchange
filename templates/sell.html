<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sell / Rent - Smart Campus Hub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        .sell-page {
            max-width: 900px;
            margin: 0 auto;
        }

        .sell-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            background: #ffffff;
            color: #334155;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.08);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .image-upload {
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            background: #f8fafc;
        }

        .image-upload input {
            border: none;
            padding: 0;
            background: transparent;
        }

        .image-preview {
            display: none;
            margin-top: 18px;
        }

        .image-preview img {
            max-width: 280px;
            max-height: 220px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            object-fit: contain;
        }

        .form-note {
            margin-top: 10px;
            color: #64748b;
            font-size: 13px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .form-actions button,
        .form-actions a {
            padding: 11px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .submit-btn {
            border: none;
            background: #4f46e5;
            color: #ffffff;
        }

        .submit-btn:hover {
            background: #4338ca;
        }

        .cancel-btn {
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #475569;
            text-decoration: none;
        }

        .cancel-btn:hover {
            background: #f1f5f9;
        }

        .analyzing {
            color: #4f46e5;
        }

        .success {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }

        @media (max-width: 700px) {

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .sell-card {
                padding: 20px;
            }

            .form-actions {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

<div class="layout">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <div class="logo">

            <h2>
                Smart Campus Hub
            </h2>

        </div>


        <nav class="menu">

            <a href="/"
               class="menu-item">
                Home
            </a>

            <a href="/marketplace/"
               class="menu-item">
                Marketplace
            </a>

            <a href="/sell-rent/"
               class="menu-item active">
                Sell / Rent
            </a>

            <a href="/lost_found/"
               class="menu-item">
                Lost & Found
            </a>

        </nav>


        <div class="help-box">

            <h3>
                List your unused items.
            </h3>

            <p>
                Sell or rent useful items to other students on campus.
            </p>

        </div>

    </aside>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="content">


        <!-- HEADER -->

        <header class="top-header">

            <div>

                <h1>
                    Sell / Rent an Item
                </h1>

                <p>
                    List an item for other students on campus.
                </p>

            </div>


            <div class="search-profile">

                <div class="profile-icon">
                    👤
                </div>

            </div>

        </header>



        <!-- =================================================
             FORM
        ================================================== -->

        <div class="sell-page">

            <div class="sell-card">


                <form
                    id="sellForm"
                    action="/sell-rent/add/"
                    method="POST"
                    enctype="multipart/form-data"
                >


                     <!-- =================================================
                         IMAGE
                    ================================================== -->

                    <div class="form-group">

                        <label for="image">
                            Item Photo
                        </label>


                        <div class="image-upload">


                            <input
                                type="file"
                                id="image"
                                name="image"
                                accept="image/png,image/jpeg,image/jpg,image/webp"
                                required
                            >


                            <p
                                id="imageStatus"
                                class="form-note"
                            >
                                Upload an image to automatically detect
                                item details.
                            </p>


                            <div
                                id="imagePreview"
                                class="image-preview"
                            >

                                <img
                                    id="previewImage"
                                    src="#"
                                    alt="Selected item"
                                >

                            </div>


                        </div>

                    </div>




                    <!-- =================================================
                         ITEM NAME
                    ================================================== -->

                    <div class="form-group">

                        <label for="title">
                            Item Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            name="title"
                            placeholder="e.g. Dell Laptop"
                            autocomplete="off"
                            required
                        >

                    </div>



                    <!-- =================================================
                         DESCRIPTION
                    ================================================== -->

                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            placeholder="Describe your item..."
                            autocomplete="off"
                            required
                        ></textarea>

                    </div>



                    <!-- =================================================
                         CATEGORY + LISTING TYPE
                    ================================================== -->

                    <div class="form-row">


                        <div class="form-group">

                            <label for="category">
                                Category
                            </label>

                            <input
                                type="text"
                                id="category"
                                name="category"
                                placeholder="e.g. Books"
                                autocomplete="off"
                                required
                            >

                        </div>



                        <div class="form-group">

                            <label for="listing_type">
                                Listing Type
                            </label>

                            <select
                                id="listing_type"
                                name="listing_type"
                                required
                            >

                                <option value="">
                                    Select type
                                </option>

                                <option value="sell">
                                    Sell
                                </option>

                                <option value="rent">
                                    Rent
                                </option>

                            </select>

                        </div>

                    </div>



                    <!-- =================================================
                         COLOR + TAGS
                    ================================================== -->

                    <div class="form-row">


                        <div class="form-group">

                            <label for="color">
                                Color
                            </label>

                            <input
                                type="text"
                                id="color"
                                name="color"
                                placeholder="e.g. Black"
                                autocomplete="off"
                            >

                        </div>



                        <div class="form-group">

                            <label for="tags">
                                Tags
                            </label>

                            <input
                                type="text"
                                id="tags"
                                name="tags"
                                placeholder="e.g. bicycle, cycle, sports"
                                autocomplete="off"
                            >

                        </div>

                    </div>



                    <!-- =================================================
                         PRICE + CONDITION
                    ================================================== -->

                    <div class="form-row">


                        <div class="form-group">

                            <label for="price">
                                Price (₹)
                            </label>

                            <input
                                type="number"
                                id="price"
                                name="price"
                                min="0"
                                step="1"
                                placeholder="e.g. 500"
                                required
                            >

                        </div>



                        <div class="form-group">

                            <label for="condition">
                                Condition
                            </label>

                            <select
                                id="condition"
                                name="condition"
                                required
                            >

                                <option value="">
                                    Select condition
                                </option>

                                <option value="new">
                                    New
                                </option>

                                <option value="used">
                                    Used
                                </option>

                            </select>

                        </div>

                    </div>



                   

                    <!-- =================================================
                         BUTTONS
                    ================================================== -->

                    <div class="form-actions">


                        <button
                            type="submit"
                            class="submit-btn"
                        >
                            List Item
                        </button>


                        <a
                            href="/marketplace/"
                            class="cancel-btn"
                        >
                            Cancel
                        </a>


                    </div>


                </form>

            </div>

        </div>


    </main>

</div>



<!-- =========================================================
     JAVASCRIPT
========================================================== -->

<script>

    const imageInput =
        document.getElementById("image");

    const imagePreview =
        document.getElementById("imagePreview");

    const previewImage =
        document.getElementById("previewImage");

    const imageStatus =
        document.getElementById("imageStatus");


    const titleInput =
        document.getElementById("title");

    const descriptionInput =
        document.getElementById("description");

    const categoryInput =
        document.getElementById("category");

    const conditionInput =
        document.getElementById("condition");

    const colorInput =
        document.getElementById("color");

    const tagsInput =
        document.getElementById("tags");

    const priceInput =
        document.getElementById("price");



    /* =========================================================
       IMAGE UPLOAD
    ========================================================== */

    imageInput.addEventListener(
        "change",
        async function () {


            const file =
                this.files[0];


            if (!file) {

                imagePreview.style.display =
                    "none";

                previewImage.src =
                    "#";

                imageStatus.textContent =
                    "Upload an image to automatically detect item details.";

                imageStatus.className =
                    "form-note";

                return;
            }



            /* Check image */

            if (!file.type.startsWith("image/")) {

                imageInput.value =
                    "";

                imagePreview.style.display =
                    "none";

                previewImage.src =
                    "#";

                imageStatus.textContent =
                    "Please select an image file.";

                imageStatus.className =
                    "form-note error";

                return;
            }



            /* =====================================================
               SHOW PREVIEW
            ====================================================== */

            previewImage.src =
                URL.createObjectURL(file);

            imagePreview.style.display =
                "block";


            imageStatus.textContent =
                "Analyzing image...";

            imageStatus.className =
                "form-note analyzing";



            /* =====================================================
               SEND IMAGE TO BACKEND
               
               CORRECT ROUTE:
               
               POST /api/sell-rent/analyze-image/
            ====================================================== */

            const formData =
                new FormData();

            formData.append(
                "image",
                file
            );


            try {


                const response =
                    await fetch(
                        "/api/sell-rent/analyze-image/",
                        {
                            method: "POST",
                            body: formData
                        }
                    );



                /* =================================================
                   CHECK HTTP RESPONSE
                ================================================== */

                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(
                        "Image analysis HTTP error:",
                        response.status,
                        errorText
                    );

                    throw new Error(
                        "Image analysis failed: HTTP " +
                        response.status
                    );
                }



                /* =================================================
                   GET JSON
                ================================================== */

                const data =
                    await response.json();


                console.log(
                    "Image analysis API response:",
                    data
                );



                /* =================================================
                   ITEM NAME
                ================================================== */

                if (
                    data.item_name !== undefined &&
                    data.item_name !== null
                ) {

                    titleInput.value =
                        data.item_name;

                }



                /* =================================================
                   CATEGORY
                ================================================== */

                if (
                    data.category !== undefined &&
                    data.category !== null
                ) {

                    categoryInput.value =
                        data.category;

                }



                /* =================================================
                   CONDITION
                ================================================== */

                if (
                    data.condition !== undefined &&
                    data.condition !== null
                ) {


                    const detectedCondition =
                        String(
                            data.condition
                        ).trim();


                    let matched =
                        false;


                    for (
                        let i = 0;
                        i < conditionInput.options.length;
                        i++
                    ) {


                        const option =
                            conditionInput.options[i];


                        if (
                            option.value.toLowerCase() ===
                                detectedCondition.toLowerCase()
                            ||
                            option.text.toLowerCase() ===
                                detectedCondition.toLowerCase()
                        ) {


                            conditionInput.value =
                                option.value;


                            matched =
                                true;


                            break;

                        }

                    }



                    /*
                     * If Gemini returns a condition
                     * not present in the dropdown,
                     * add it automatically.
                     */

                    if (
                        !matched &&
                        detectedCondition !== ""
                    ) {


                        const newOption =
                            document.createElement(
                                "option"
                            );


                        newOption.value =
                            detectedCondition;

                        newOption.textContent =
                            detectedCondition;


                        conditionInput.appendChild(
                            newOption
                        );


                        conditionInput.value =
                            detectedCondition;

                    }

                }



                /* =================================================
                   COLOR
                ================================================== */

                if (
                    data.color !== undefined &&
                    data.color !== null
                ) {

                    colorInput.value =
                        data.color;

                }



                /* =================================================
                   TAGS
                ================================================== */

                if (
                    data.tags !== undefined &&
                    data.tags !== null
                ) {


                    if (
                        Array.isArray(data.tags)
                    ) {

                        tagsInput.value =
                            data.tags.join(", ");

                    }
                    else {

                        tagsInput.value =
                            data.tags;

                    }

                }



                /* =================================================
                   DESCRIPTION
                ================================================== */

                if (
                    data.description !== undefined &&
                    data.description !== null
                ) {

                    descriptionInput.value =
                        data.description;

                }



                /* =================================================
                   SUGGESTED PRICE
                ================================================== */

                if (
                    data.suggested_price !== undefined &&
                    data.suggested_price !== null &&
                    data.suggested_price !== ""
                ) {


                    const numericPrice =
                        String(
                            data.suggested_price
                        )
                        .replace(
                            /[^0-9.]/g,
                            ""
                        );


                    if (numericPrice) {

                        priceInput.value =
                            numericPrice;

                    }

                }



                /* =================================================
                   SUCCESS
                ================================================== */

                imageStatus.textContent =
                    "Image analyzed successfully. You can edit the detected details.";

                imageStatus.className =
                    "form-note success";


                console.log(
                    "All detected fields autofilled."
                );

            }


            catch (error) {


                console.error(
                    "Image analysis error:",
                    error
                );


                imageStatus.textContent =
                    "Could not analyze the image. You can enter the details manually.";

                imageStatus.className =
                    "form-note error";

            }

        }
    );

</script>


</body>

</html>
